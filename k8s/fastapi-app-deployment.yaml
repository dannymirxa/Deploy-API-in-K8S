apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yaml -o k8s convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: fastapi-app
  name: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: fastapi-app
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yaml -o k8s convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: fastapi-app
    spec:
      containers:
        - env:
            - name: ENV
              value: production
          image: dannymirza/fastapi-chinook:latest
          name: fastapi-app
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /app
              name: fastapi-app-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: fastapi-app-cm0
          name: fastapi-app-cm0
