apiVersion: apps/v1
kind: Deployment
metadata:
  name: chinook-api-deployment
  namespace: fastapi-chinook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chinook-api
  template:
    metadata:
      labels:
        app: chinook-api
    spec:
      containers:
        - env:
          - name: ENV
            value: production
          image: fastapi-chinook:latest
          name: fastapi-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: chinook-db
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.5"
            limits:
              memory: "512Mi"
              cpu: "1"
      volumes:
        - name: chinook-db
          persistentVolumeClaim:
            claimName: chinook-api-pvc